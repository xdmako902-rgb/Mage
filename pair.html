<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>BLACK QUEEN MD | Pair Site</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@400;500;600;700;800;900&display=swap');
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:100%;min-height:100%}
body{font-family:'Orbitron',sans-serif;background:#000;color:#fff;overflow-x:hidden}
body::before{content:"";position:fixed;inset:0;background:radial-gradient(circle at 20% 20%,rgba(255,255,255,.08),transparent 25%),radial-gradient(circle at 80% 80%,rgba(255,255,255,.06),transparent 30%),radial-gradient(circle at 50% 50%,rgba(255,255,255,.025),transparent 45%);pointer-events:none;z-index:-3}
body::after{content:"";position:fixed;inset:0;background-image:linear-gradient(rgba(255,255,255,.025) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.025) 1px,transparent 1px);background-size:45px 45px;mask-image:linear-gradient(to bottom,transparent,#000 20%,#000 80%,transparent);z-index:-2}
.particles{position:fixed;inset:0;overflow:hidden;z-index:-1;pointer-events:none}
.particle{position:absolute;width:2px;height:2px;background:#fff;border-radius:50%;box-shadow:0 0 10px #fff,0 0 20px #fff;animation:float linear infinite;opacity:.7}
@keyframes float{from{transform:translateY(110vh) scale(.3);opacity:0}15%{opacity:.8}85%{opacity:.8}to{transform:translateY(-10vh) scale(1);opacity:0}}
.container{width:100%;max-width:900px;margin:auto;min-height:100vh;padding:35px 18px;display:flex;flex-direction:column;align-items:center;justify-content:center}
.logo-box{width:115px;height:115px;border:1px solid rgba(255,255,255,.5);border-radius:50%;display:flex;justify-content:center;align-items:center;margin-bottom:25px;position:relative;box-shadow:0 0 15px rgba(255,255,255,.5),inset 0 0 20px rgba(255,255,255,.08);animation:pulse 3s infinite}
.logo-box::before{content:"";position:absolute;inset:-8px;border-radius:50%;border:1px solid rgba(255,255,255,.15);animation:spin 8s linear infinite}
.logo-box::after{content:"";position:absolute;inset:-18px;border-radius:50%;border:1px dashed rgba(255,255,255,.08);animation:spinReverse 12s linear infinite}
.crown{font-size:45px;filter:drop-shadow(0 0 12px #fff)}
.title{font-size:clamp(38px,9vw,75px);font-weight:900;letter-spacing:5px;text-align:center;line-height:1;color:#fff;text-shadow:0 0 5px #fff,0 0 15px #fff,0 0 35px rgba(255,255,255,.8),0 0 70px rgba(255,255,255,.35)}
.subtitle{margin-top:14px;font-size:clamp(10px,2.5vw,15px);letter-spacing:6px;color:#aaa;text-align:center}
.line{width:160px;height:1px;margin:24px auto 30px;background:#fff;box-shadow:0 0 10px #fff,0 0 25px #fff}
.pair-card{width:100%;max-width:650px;padding:35px 25px;background:rgba(255,255,255,.035);border:1px solid rgba(255,255,255,.18);border-radius:28px;backdrop-filter:blur(15px);-webkit-backdrop-filter:blur(15px);box-shadow:0 0 25px rgba(255,255,255,.05),inset 0 0 30px rgba(255,255,255,.025);position:relative;overflow:hidden}
.pair-card::before{content:"";position:absolute;width:250px;height:250px;background:rgba(255,255,255,.05);filter:blur(80px);border-radius:50%;top:-120px;left:-100px}
.pair-card::after{content:"";position:absolute;width:200px;height:200px;background:rgba(255,255,255,.035);filter:blur(70px);border-radius:50%;bottom:-100px;right:-80px}
.pair-title{text-align:center;font-size:13px;color:#aaa;letter-spacing:4px;margin-bottom:25px}
.input-wrap{position:relative;margin-bottom:18px}
.input{width:100%;height:58px;border-radius:16px;border:1px solid rgba(255,255,255,.22);background:rgba(0,0,0,.65);color:#fff;outline:none;padding:0 20px;font-family:'Orbitron';font-size:13px;transition:.3s}
.input::placeholder{color:#666}
.input:focus{border-color:#fff;box-shadow:0 0 10px rgba(255,255,255,.2),0 0 25px rgba(255,255,255,.08)}
.pair-btn{width:100%;height:60px;border:1px solid #fff;border-radius:16px;background:#fff;color:#000;font-family:'Orbitron';font-weight:900;letter-spacing:3px;cursor:pointer;transition:.35s;box-shadow:0 0 10px rgba(255,255,255,.8),0 0 30px rgba(255,255,255,.25)}
.pair-btn:hover{background:#000;color:#fff;box-shadow:0 0 15px #fff,0 0 45px rgba(255,255,255,.35);transform:translateY(-2px)}
.pair-btn:active{transform:scale(.97)}
.owner-section{width:100%;max-width:650px;margin-top:25px;display:grid;grid-template-columns:1fr 1fr;gap:15px}
.owner{position:relative;padding:25px 15px;text-align:center;border:1px solid rgba(255,255,255,.16);background:rgba(255,255,255,.025);border-radius:22px;backdrop-filter:blur(12px);transition:.35s;overflow:hidden}
.owner:hover{border-color:rgba(255,255,255,.55);transform:translateY(-5px);box-shadow:0 0 25px rgba(255,255,255,.1)}
.owner-label{font-size:9px;letter-spacing:3px;color:#777;margin-bottom:10px}
.owner-name{font-size:clamp(15px,4vw,22px);font-weight:900;letter-spacing:2px;color:#fff;text-shadow:0 0 12px rgba(255,255,255,.7)}
.status{margin-top:28px;display:flex;align-items:center;gap:9px;color:#888;font-size:9px;letter-spacing:3px}
.status-dot{width:7px;height:7px;background:#fff;border-radius:50%;box-shadow:0 0 8px #fff,0 0 18px #fff;animation:blink 1.5s infinite}
.footer{margin-top:30px;text-align:center;color:#444;font-size:8px;letter-spacing:3px}
.footer span{color:#888}
.loading{display:none;text-align:center;margin-top:20px;color:#aaa;font-size:10px;letter-spacing:3px}
.loader{width:25px;height:25px;margin:0 auto 12px;border:2px solid rgba(255,255,255,.15);border-top-color:#fff;border-radius:50%;animation:spin 1s linear infinite}
.result{display:none;margin-top:20px;padding:18px;border:1px solid rgba(255,255,255,.2);border-radius:15px;text-align:center;background:rgba(255,255,255,.03)}
.result-title{font-size:10px;letter-spacing:3px;color:#777;margin-bottom:8px}
.result-text{font-size:13px;word-break:break-word;color:#fff;text-shadow:0 0 10px #fff}
@keyframes pulse{0%,100%{box-shadow:0 0 15px rgba(255,255,255,.4),inset 0 0 20px rgba(255,255,255,.08)}50%{box-shadow:0 0 35px rgba(255,255,255,.8),inset 0 0 30px rgba(255,255,255,.12)}}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes spinReverse{to{transform:rotate(-360deg)}}
@keyframes blink{0%,100%{opacity:.3}50%{opacity:1}}
@media(max-width:550px){.container{padding:28px 15px}.logo-box{width:95px;height:95px}.crown{font-size:37px}.title{letter-spacing:3px}.subtitle{letter-spacing:4px}.pair-card{padding:28px 17px;border-radius:22px}.owner-section{gap:10px}.owner{padding:20px 8px}.owner-name{font-size:14px}}
</style>
</head>
<body>
<div class="particles" id="particles"></div>
<main class="container">
<div class="logo-box"><div class="crown">♛</div></div>
<h1 class="title">BLACK QUEEN</h1>
<div class="subtitle">MD • PAIR SYSTEM</div>
<div class="line"></div>
<section class="pair-card">
<div class="pair-title">ENTER YOUR NUMBER</div>
<div class="input-wrap"><input id="phone" class="input" type="tel" placeholder="947XXXXXXXX" autocomplete="off"></div>
<button class="pair-btn" onclick="generatePair()">GENERATE PAIR CODE</button>
<div class="loading" id="loading"><div class="loader"></div>GENERATING PAIR CODE...</div>
<div class="result" id="result"><div class="result-title">PAIR STATUS</div><div class="result-text" id="resultText">Ready</div></div>
</section>
<section class="owner-section">
<div class="owner"><div class="owner-label">OWNER</div><div class="owner-name">MAKO</div></div>
<div class="owner"><div class="owner-label">DEVELOPER</div><div class="owner-name">SIRIMATH DEV</div></div>
</section>
<div class="status"><span class="status-dot"></span>SYSTEM ONLINE</div>
<div class="footer">BLACK QUEEN MD • <span>POWERED BY SIRIMATH DEV</span></div>
</main>
<script>
const particles=document.getElementById("particles");
for(let i=0;i<45;i++){const p=document.createElement("div");p.className="particle";p.style.left=Math.random()*100+"%";p.style.animationDuration=(5+Math.random()*10)+"s";p.style.animationDelay=Math.random()*8+"s";p.style.transform=`scale(${.3+Math.random()})`;particles.appendChild(p)}
function generatePair(){
 const phone=document.getElementById("phone").value.trim(),loading=document.getElementById("loading"),result=document.getElementById("result"),resultText=document.getElementById("resultText");
 if(phone===""){result.style.display="block";resultText.innerHTML="⚠ PLEASE ENTER YOUR PHONE NUMBER";return}
 loading.style.display="block";result.style.display="none";
 setTimeout(()=>{loading.style.display="none";result.style.display="block";resultText.innerHTML="PAIR REQUEST SENT • "+phone},1500);
}
document.getElementById("phone").addEventListener("keydown",e=>{if(e.key==="Enter")generatePair()});
</script>
</body>
                                                                                     </html>
